<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#4CAF50" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="植物日記" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-192.png" />
<title>植物観察日記</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: #FAFAF6;
    font-family: "Noto Sans JP", -apple-system, system-ui, sans-serif;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior: none;
  }
  #root { width: 100%; min-height: 100dvh; }

  /* Scrollbar hide for mobile feel */
  ::-webkit-scrollbar { display: none; }
  * { scrollbar-width: none; }

  /* Screen transition */
  @keyframes fadeSlideIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: none; }
  }
  .screen-enter { animation: fadeSlideIn 0.18s ease-out forwards; }

  /* Native-feel tap targets */
  input, textarea, select {
    -webkit-appearance: none;
    appearance: none;
    font-family: inherit;
  }

  input[type="date"]::-webkit-calendar-picker-indicator {
    opacity: 0.5;
  }

  /* Prevent text selection on tap */
  button, [role="button"] { user-select: none; -webkit-user-select: none; }
</style>
</head>
<body>
<div id="root">
  <div style="display:flex;align-items:center;justify-content:center;height:100dvh;color:#9E9E9E;font-family:sans-serif;font-size:14px;">
    読み込み中…
  </div>
</div>

<!-- React + Babel from CDN -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"

  crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
  integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"
  crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
  integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"
  crossorigin="anonymous"></script>

<!-- App files (load order matters) -->
<script type="text/babel" src="app-tokens.jsx"></script>
<script src="db.js"></script>
<script type="text/babel" src="app.jsx"></script>

<script>
  // Register service worker for offline support
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
